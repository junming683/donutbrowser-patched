name: Build Patched

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Rust (needed for licenses:generate prebuild)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: pnpm install

      - name: Build frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_TURNSTILE: ""

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut-browser-patched
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/donutbrowser.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Donut_*.exe